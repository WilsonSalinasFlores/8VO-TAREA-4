<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary mb-0"><i class="bi bi-journal-bookmark-fill me-2"></i>Mis Contactos</h2>
    <a routerLink="/agenda/nuevo" class="btn btn-primary rounded-pill shadow-sm px-4 fw-bold">
      <i class="bi bi-person-plus-fill me-2"></i>Nuevo Contacto
    </a>
  </div>

  <div *ngIf="error" class="alert alert-danger fw-bold shadow-sm">{{ error }}</div>
  
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!cargando && contactos.length === 0" class="alert alert-info text-center py-5 shadow-sm rounded-4">
    <i class="bi bi-journal-x fs-1 d-block mb-3"></i>
    <h4 class="fw-bold">No tienes contactos registrados.</h4>
    <p class="mb-0">¡Comienza agregando tu primer contacto ahora!</p>
  </div>

  <div *ngIf="!cargando && contactos.length > 0" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    <div class="col" *ngFor="let contacto of contactos">
      <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden" [ngClass]="{'border-top border-5 border-success': contacto.tipo === 'Trabajo', 'border-top border-5 border-info': contacto.tipo === 'Personal', 'border-top border-5 border-warning': contacto.tipo === 'Proveedores', 'border-top border-5 border-secondary': contacto.tipo === 'Otros'}">
        <div class="card-body position-relative">
          <span class="badge bg-success position-absolute top-0 end-0 m-3" *ngIf="contacto.tipo === 'Trabajo'">TRABAJO</span>
          <span class="badge bg-info position-absolute top-0 end-0 m-3" *ngIf="contacto.tipo === 'Personal'">PERSONAL</span>
          <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-3" *ngIf="contacto.tipo === 'Proveedores'">PROVEEDORES</span>
          <div class="d-flex align-items-center mb-3">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
              <i class="bi bi-person-fill fs-2"></i>
            </div>
            <div>
              <h5 class="card-title fw-bold mb-1">{{ contacto.nombres }} {{ contacto.apellidos }}</h5>
              <p class="card-text text-muted mb-0"><i class="bi bi-telephone-fill me-2"></i>{{ contacto.telefono }}</p>
            </div>
          </div>
          <hr>
          <p class="card-text mb-1 text-truncate" *ngIf="contacto.direccion"><i class="bi bi-geo-alt-fill text-muted me-2"></i>{{ contacto.direccion }}</p>
          <p class="card-text mb-1 text-truncate" *ngIf="contacto.empresa"><i class="bi bi-building text-muted me-2"></i>{{ contacto.empresa }}</p>
        </div>
        <div class="card-footer bg-white border-0 p-3 d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm flex-grow-1 rounded-pill fw-bold" (click)="editar(contacto.id)">
            <i class="bi bi-pencil-fill me-1"></i>Editar
          </button>
          <button class="btn btn-outline-danger btn-sm flex-grow-1 rounded-pill fw-bold" (click)="eliminar(contacto.id)">
            <i class="bi bi-trash-fill me-1"></i>Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
